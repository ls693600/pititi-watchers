# Every push and pull request: the same checks deploy.sh runs, on GitHub's machines instead of one laptop.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint src tests
      - run: npx vitest run

  e2e:
    name: Browser tests (iPhone + Android engines)
    # Pinned: Playwright 1.59 has no WebKit build for Ubuntu 26.04 (ubuntu-latest since late 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npx playwright test
      - name: Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e-report
            test-results
          retention-days: 7

  database:
    name: Database rules (fresh Supabase from migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Builds a throwaway local Supabase and runs migrations 001-014 in order: a migration that breaks fails here
      - run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      # supabase/tests: who can read and change what (households, viewers, strangers, photos, reactions, sign-up codes)
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
